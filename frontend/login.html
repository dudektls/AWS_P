<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="스터디 모집 서비스 로그인" />
  <title>로그인 | 스터디 모집</title>
  <link rel="stylesheet" href="./css/auth.css" />
</head>

<body>
  <header class="auth-header">
    <a class="brand" href="./index.html" aria-label="스터디 모집 홈으로 이동">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span>스터디 모집</span>
    </a>
    <a class="back-link" href="./index.html">스터디 둘러보기</a>
  </header>

  <main class="auth-layout">
    <section class="auth-intro" aria-labelledby="intro-title">
      <div>
        <p class="eyebrow">WELCOME BACK</p>
        <h1 id="intro-title">함께 공부할 사람을 다시 만나보세요.</h1>
        <p class="intro-description">
          내 시간에 맞는 오프라인 스터디를 찾고, 새로운 학습 목표를 이어가세요.
        </p>
      </div>
      <p class="intro-note">AVAILABLE TIME · OFFLINE STUDY</p>
    </section>

    <section class="auth-card" aria-labelledby="login-title">
      <div class="card-heading">
        <p class="section-kicker">계정 로그인</p>
        <h2 id="login-title">로그인</h2>
        <p>등록한 계정으로 서비스를 이용해 보세요.</p>
      </div>

      <form class="auth-form" id="login-form">
        <label class="field">
          <span>이메일</span>
          <input type="email" name="email" autocomplete="email" placeholder="example@university.ac.kr" required />
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input type="password" name="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required />
        </label>

        <div class="form-options">
          <label class="check-label">
            <input type="checkbox" name="remember" />
            <span>로그인 상태 유지</span>
          </label>
          <button class="text-button" type="button">비밀번호 찾기</button>
        </div>

        <button class="button button-primary" type="submit">로그인</button>
      </form>

      <div class="divider"><span>또는</span></div>

      <button class="button google-button" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3c1.9-1.8 2.9-4.4 2.9-7.5Z" />
          <path fill="#34A853"
            d="M12 22c2.7 0 5-.9 6.7-2.3l-3.3-2.6c-.9.6-2.1 1-3.4 1a5.9 5.9 0 0 1-5.5-4.1H3.1v2.6A10 10 0 0 0 12 22Z" />
          <path fill="#FBBC05" d="M6.5 14a6 6 0 0 1 0-3.9V7.4H3.1a10 10 0 0 0 0 9.1L6.5 14Z" />
          <path fill="#EA4335"
            d="M12 6c1.5 0 2.9.5 3.9 1.5l2.9-2.8A9.7 9.7 0 0 0 12 2a10 10 0 0 0-8.9 5.5l3.4 2.6A5.9 5.9 0 0 1 12 6Z" />
        </svg>
        Google로 로그인
      </button>

      <p class="auth-switch">아직 계정이 없나요? <a href="./signup.html">회원가입</a></p>
    </section>
  </main>
</body>

</html>
