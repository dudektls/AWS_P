<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="스터디 모집 서비스 회원가입" />
    <title>회원가입 | 스터디 모집</title>
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <header class="auth-header">
      <a class="brand" href="./index.html" aria-label="스터디 모집 홈으로 이동">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>스터디 모집</span>
      </a>
      <a class="back-link" href="./index.html">스터디 둘러보기</a>
    </header>

    <main class="auth-layout">
      <section class="auth-intro signup-intro" aria-labelledby="intro-title">
        <div>
          <p class="eyebrow">START TOGETHER</p>
          <h1 id="intro-title">나에게 꼭 맞는<br />스터디를 시작하세요.</h1>
          <p class="intro-description">
            가용시간을 등록하면 참여할 수 있는 스터디를<br />더 쉽고 정확하게 찾을 수 있어요.
          </p>
        </div>
        <p class="intro-note">PLAN · MEET · GROW TOGETHER</p>
      </section>

      <section class="auth-card signup-card" aria-labelledby="signup-title">
        <div class="card-heading">
          <p class="section-kicker">새 계정 만들기</p>
          <h2 id="signup-title">회원가입</h2>
          <p>스터디 모집을 이용할 기본 정보를 입력해 주세요.</p>
        </div>

        <form class="auth-form" id="signup-form">
          <label class="field">
            <span>이메일</span>
            <input type="email" name="email" autocomplete="email" placeholder="example@university.ac.kr" required />
          </label>
          <label class="field">
            <span>닉네임</span>
            <input type="text" name="nickname" autocomplete="nickname" placeholder="사용할 닉네임을 입력하세요" required />
          </label>
          <div class="field-row">
            <label class="field">
              <span>비밀번호</span>
              <input type="password" name="password" autocomplete="new-password" placeholder="8자 이상" minlength="8" required />
            </label>
            <label class="field">
              <span>비밀번호 확인</span>
              <input type="password" name="passwordConfirm" autocomplete="new-password" placeholder="한 번 더 입력하세요" minlength="8" required />
            </label>
          </div>

          <label class="check-label agreement">
            <input type="checkbox" name="terms" required />
            <span><a href="#terms">이용약관</a>과 <a href="#privacy">개인정보 처리방침</a>에 동의합니다.</span>
          </label>

          <button class="button button-primary" type="submit">회원가입</button>
        </form>

        <div class="divider"><span>또는</span></div>

        <button class="button google-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3c1.9-1.8 2.9-4.4 2.9-7.5Z" />
            <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.3l-3.3-2.6c-.9.6-2.1 1-3.4 1a5.9 5.9 0 0 1-5.5-4.1H3.1v2.6A10 10 0 0 0 12 22Z" />
            <path fill="#FBBC05" d="M6.5 14a6 6 0 0 1 0-3.9V7.4H3.1a10 10 0 0 0 0 9.1L6.5 14Z" />
            <path fill="#EA4335" d="M12 6c1.5 0 2.9.5 3.9 1.5l2.9-2.8A9.7 9.7 0 0 0 12 2a10 10 0 0 0-8.9 5.5l3.4 2.6A5.9 5.9 0 0 1 12 6Z" />
          </svg>
          Google로 회원가입
        </button>

        <p class="auth-switch">이미 계정이 있나요? <a href="./login.html">로그인</a></p>
      </section>
    </main>
  </body>
</html>
